<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1215" />
      <stop offset="100%" stop-color="#0E0A0B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D11F40" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3A0D16" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect x="2" y="2" width="104" height="104" rx="26" ry="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Moon (Crescent) -->
  <path fill="#FFF3D9DC" d="M56,27 A4.5,4.5 0 1,0 56,35 A4,4 0 0,1 56,27 Z" />

  <!-- Face: Shadowed Left Half -->
  <path fill="#9E1028" d="M54,40 L46,37 L38,26 L33,45 L27,50 L31,55 L27,61 L33,64 L41,73 L54,83 Z" />

  <!-- Face: Lit Right Half -->
  <path fill="#D11F40" d="M54,40 L62,37 L70,26 L75,45 L81,50 L77,55 L81,61 L75,64 L67,73 L54,83 Z" />

  <!-- Jaw Facets -->
  <path fill="#7A0B1F" d="M33,64 L41,73 L54,83 L51,70 Z" />
  <path fill="#AA1431" d="M75,64 L67,73 L54,83 L57,70 Z" />

  <!-- Brow-to-muzzle Ridge -->
  <path fill="#EC5269" d="M54,42 L60,52 L57,70 L54,74 L51,70 L48,52 Z" />

  <!-- Inner Ears -->
  <path fill="#4A0612" d="M40,31 L45,38 L37,43 Z M68,31 L63,38 L71,43 Z" />

  <!-- Winged Eyes and Nose -->
  <path fill="#0E0A0B" d="M36,49 L47,53 L45,57 L41,56 Z M72,49 L61,53 L63,57 L67,56 Z M50,70 L58,70 L54,75 Z" />
</svg>
