<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D10" />
      <stop offset="100%" stop-color="#0A0708" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1418" />
      <stop offset="100%" stop-color="#140D10" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D11F40" />
      <stop offset="100%" stop-color="#FF5271" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B074" />
      <stop offset="100%" stop-color="#10D890" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#38B6FF" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #F3D9DC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #A58E92; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    .card-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #C4B5B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #FF8598; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="520" rx="16" fill="url(#bg)" stroke="#2B1A20" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="45" class="title">Wallupus Architecture &amp; DNS Interception Flow</text>
  <text x="40" y="68" class="subtitle">Strict DNS-only capture: all TCP/UDP traffic flows untouched at wire speed; zero background telemetry.</text>

  <!-- 1. Applications Box -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="200" height="380" rx="12" fill="url(#cardBg)" stroke="#382128" stroke-width="1.2"/>
    <rect x="15" y="16" width="32" height="32" rx="8" fill="#2B1A20" />
    <text x="25" y="38" font-size="16">📱</text>
    <text x="56" y="32" class="card-title">Installed Apps</text>
    <text x="56" y="48" class="subtitle">Android Userspace</text>

    <!-- App Items -->
    <rect x="16" y="70" width="168" height="42" rx="8" fill="#140D10" stroke="#2B1A20"/>
    <text x="28" y="96" class="card-text">🌐 Browsers (Chrome / Firefox)</text>

    <rect x="16" y="122" width="168" height="42" rx="8" fill="#140D10" stroke="#2B1A20"/>
    <text x="28" y="148" class="card-text">📺 Media &amp; Streaming Apps</text>

    <rect x="16" y="174" width="168" height="42" rx="8" fill="#140D10" stroke="#2B1A20"/>
    <text x="28" y="200" class="card-text">💬 Messengers &amp; Social</text>

    <rect x="16" y="226" width="168" height="42" rx="8" fill="#140D10" stroke="#2B1A20"/>
    <text x="28" y="252" class="card-text">🎮 Games &amp; System Services</text>

    <!-- Direct Traffic Callout -->
    <rect x="16" y="285" width="168" height="75" rx="8" fill="#0D2418" stroke="#135E38"/>
    <text x="26" y="306" fill="#10D890" font-size="12" font-weight="700">⚡ Non-DNS Traffic</text>
    <text x="26" y="324" fill="#9AE6B4" font-size="11">HTTPS, WebSockets, UDP</text>
    <text x="26" y="342" fill="#71D599" font-size="10">→ 100% Direct Wire Speed</text>
  </g>

  <!-- Flow 1: Direct Non-DNS Traffic (bottom curve to Internet) -->
  <path d="M 240 420 C 350 420, 650 420, 750 420" fill="none" stroke="#00B074" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="752,420 744,415 744,425" fill="#00B074"/>
  <text x="440" y="412" fill="#10D890" font-size="11" font-weight="600">Bypasses Tunnel Completely (Zero Overhead)</text>

  <!-- Flow 2: DNS queries to TUN -->
  <path d="M 240 180 L 295 180" fill="none" stroke="#D11F40" stroke-width="2.5"/>
  <polygon points="300,180 290,174 290,186" fill="#D11F40"/>
  <text x="248" y="170" class="flow-label">DNS (UDP 53)</text>

  <!-- 2. Local VPN Tunnel (WallupusVpnService) -->
  <g transform="translate(300, 100)" filter="url(#shadow)">
    <rect width="420" height="270" rx="12" fill="url(#cardBg)" stroke="#5E1624" stroke-width="1.5"/>
    
    <!-- Top badge -->
    <rect x="16" y="14" width="388" height="34" rx="6" fill="#2B1017"/>
    <text x="30" y="36" fill="#FF8598" font-size="13" font-weight="700">🛡️ Wallupus Engine (Local VpnService TUN)</text>
    
    <!-- UID resolution -->
    <rect x="16" y="58" width="186" height="56" rx="8" fill="#160C10" stroke="#3A1822"/>
    <text x="26" y="78" fill="#F3D9DC" font-size="12" font-weight="600">Kernel UID Lookup</text>
    <text x="26" y="96" fill="#A58E92" font-size="10">ConnectivityManager UID</text>
    <text x="26" y="108" fill="#A58E92" font-size="10">→ Resolves App Name &amp; Icon</text>

    <!-- RAM Query Log -->
    <rect x="218" y="58" width="186" height="56" rx="8" fill="#160C10" stroke="#3A1822"/>
    <text x="228" y="78" fill="#F3D9DC" font-size="12" font-weight="600">Ephemeral RAM Log</text>
    <text x="228" y="96" fill="#A58E92" font-size="10">Count grouping per domain</text>
    <text x="228" y="108" fill="#00B074" font-size="10">🔒 0 Disk Writes / 0 Telemetry</text>

    <!-- Inner Core: Matcher & Cache -->
    <rect x="16" y="124" width="388" height="130" rx="8" fill="#11070A" stroke="#4A121D"/>
    <text x="30" y="146" fill="#FF8598" font-size="12" font-weight="700">Compiled Rule &amp; Filter Engine</text>
    <text x="30" y="164" fill="#C4B5B8" font-size="11">Sorted 64-bit hash arrays + Zero-alloc suffix walk</text>

    <!-- Branching decisions -->
    <g transform="translate(26, 175)">
      <!-- Blocked -->
      <rect width="170" height="64" rx="6" fill="#2E0E14" stroke="#8A1326"/>
      <text x="12" y="24" fill="#FF5271" font-size="12" font-weight="700">🚫 Ad / Tracker Match</text>
      <text x="12" y="42" fill="#ECA5B2" font-size="10">Instant NXDOMAIN / TCP RST</text>
      <text x="12" y="54" fill="#A58E92" font-size="9">&lt; 0.1ms (Zero Battery Drain)</text>

      <!-- Allowed -->
      <rect x="190" width="176" height="64" rx="6" fill="#0E2319" stroke="#107C4A"/>
      <text x="202" y="24" fill="#10D890" font-size="12" font-weight="700">✅ Clean / Whitelisted</text>
      <text x="202" y="42" fill="#A3EAC4" font-size="10">512-entry LRU Cache hit</text>
      <text x="202" y="54" fill="#A58E92" font-size="9">or forward over RFC 8484 DoH</text>
    </g>
  </g>

  <!-- Flow from Tunnel to Internet -->
  <path d="M 720 235 L 775 235" fill="none" stroke="#38B6FF" stroke-width="2.5"/>
  <polygon points="780,235 770,229 770,241" fill="#38B6FF"/>
  <text x="726" y="222" fill="#70D4FF" font-size="11" font-weight="600">DoH (TLS 1.3)</text>

  <!-- 3. Upstream Internet / Resolvers -->
  <g transform="translate(780, 100)" filter="url(#shadow)">
    <rect width="180" height="380" rx="12" fill="url(#cardBg)" stroke="#1D3E57" stroke-width="1.2"/>
    <rect x="15" y="16" width="32" height="32" rx="8" fill="#132738" />
    <text x="23" y="38" font-size="16">🌐</text>
    <text x="56" y="32" class="card-title">DoH Upstream</text>
    <text x="56" y="48" class="subtitle">Pinned Bootstrap IPs</text>

    <!-- Upstreams -->
    <rect x="14" y="70" width="152" height="36" rx="6" fill="#0E1A24" stroke="#1D3E57"/>
    <text x="24" y="93" fill="#E1F2FF" font-size="11" font-weight="600">Quad9 (Default)</text>

    <rect x="14" y="114" width="152" height="36" rx="6" fill="#0E1A24" stroke="#1D3E57"/>
    <text x="24" y="137" fill="#E1F2FF" font-size="11" font-weight="600">Cloudflare (1.1.1.1)</text>

    <rect x="14" y="158" width="152" height="36" rx="6" fill="#0E1A24" stroke="#1D3E57"/>
    <text x="24" y="181" fill="#E1F2FF" font-size="11" font-weight="600">Mullvad / AdGuard</text>

    <rect x="14" y="202" width="152" height="36" rx="6" fill="#0E1A24" stroke="#1D3E57"/>
    <text x="24" y="225" fill="#E1F2FF" font-size="11" font-weight="600">Google / Custom URL</text>

    <!-- Security guarantee -->
    <rect x="14" y="254" width="152" height="106" rx="8" fill="#13202C" stroke="#254B6E"/>
    <text x="24" y="278" fill="#38B6FF" font-size="11" font-weight="700">🔒 ISP Privacy</text>
    <text x="24" y="298" fill="#A5C7E6" font-size="10">Bootstrap IPs are</text>
    <text x="24" y="312" fill="#A5C7E6" font-size="10">hardcoded in config.</text>
    <text x="24" y="332" fill="#A5C7E6" font-size="10">ISP never sees</text>
    <text x="24" y="346" fill="#A5C7E6" font-size="10">resolver domain name!</text>
  </g>
</svg>
