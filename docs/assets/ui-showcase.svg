<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D10" />
      <stop offset="100%" stop-color="#0A0708" />
    </linearGradient>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24171C" />
      <stop offset="100%" stop-color="#140D10" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3358" />
      <stop offset="100%" stop-color="#A8122C" />
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .screen-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .screen-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #A58E92; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #FFFFFF; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #B8A6A9; }
    .badge-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; font-weight: 700; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="480" rx="16" fill="url(#uiBg)" stroke="#2B1A20" stroke-width="1.5" />

  <!-- Showcase Titles -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F3D9DC">App Interface &amp; Feature Workflow</text>
  <text x="40" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#A58E92">Minimalist Jetpack Compose design built exclusively around privacy, transparency, and instant feedback.</text>

  <!-- ==================== SCREEN 1: HOME ==================== -->
  <g transform="translate(40, 95)" filter="url(#phoneShadow)">
    <rect width="210" height="350" rx="16" fill="url(#phoneFrame)" stroke="#3D1D26" stroke-width="1.2" />
    <!-- Notch/Status -->
    <rect x="75" y="8" width="60" height="5" rx="2.5" fill="#2E161D" />
    
    <!-- Title -->
    <text x="16" y="38" class="screen-header">Wallupus</text>
    <text x="16" y="52" class="screen-sub">Protected • Quad9</text>

    <!-- Center Power Button -->
    <circle cx="105" cy="140" r="54" fill="#14080B" stroke="url(#shieldGlow)" stroke-width="3" />
    <circle cx="105" cy="140" r="46" fill="#1C0A10" stroke="#FF5271" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Mini wolf inside button -->
    <g transform="translate(73, 108) scale(0.6)">
      <path fill="#FFF3D9DC" d="M56,27 A4.5,4.5 0 1,0 56,35 A4,4 0 0,1 56,27 Z" />
      <path fill="#9E1028" d="M54,40 L46,37 L38,26 L33,45 L27,50 L31,55 L27,61 L33,64 L41,73 L54,83 Z" />
      <path fill="#D11F40" d="M54,40 L62,37 L70,26 L75,45 L81,50 L77,55 L81,61 L75,64 L67,73 L54,83 Z" />
      <path fill="#7A0B1F" d="M33,64 L41,73 L54,83 L51,70 Z" />
      <path fill="#FFAA1431" d="M75,64 L67,73 L54,83 L57,70 Z" />
      <path fill="#FFEC5269" d="M54,42 L60,52 L57,70 L54,74 L51,70 L48,52 Z" />
      <path fill="#FF0E0A0B" d="M36,49 L47,53 L45,57 L41,56 Z M72,49 L61,53 L63,57 L67,56 Z M50,70 L58,70 L54,75 Z" />
    </g>
    <text x="105" y="210" text-anchor="middle" fill="#00D287" font-size="11" font-weight="700">TUNNEL ACTIVE</text>

    <!-- Two Feature Switches -->
    <rect x="14" y="230" width="182" height="38" rx="8" fill="#10070A" stroke="#2B141C"/>
    <text x="24" y="247" class="item-title">Block Ads &amp; Trackers</text>
    <text x="24" y="259" class="item-desc">Instant NXDOMAIN</text>
    <circle cx="178" cy="249" r="7" fill="#D11F40" />

    <rect x="14" y="274" width="182" height="38" rx="8" fill="#10070A" stroke="#2B141C"/>
    <text x="24" y="291" class="item-title">Encrypted DNS (DoH)</text>
    <text x="24" y="303" class="item-desc">TLS 1.3 Upstream</text>
    <circle cx="178" cy="293" r="7" fill="#00B074" />

    <!-- Label below -->
    <text x="105" y="336" text-anchor="middle" fill="#FFA3B2" font-size="11" font-weight="600">Home &amp; Master Toggles</text>
  </g>

  <!-- ==================== SCREEN 2: LOG SCREEN ==================== -->
  <g transform="translate(280, 95)" filter="url(#phoneShadow)">
    <rect width="210" height="350" rx="16" fill="url(#phoneFrame)" stroke="#3D1D26" stroke-width="1.2" />
    <rect x="75" y="8" width="60" height="5" rx="2.5" fill="#2E161D" />

    <text x="16" y="38" class="screen-header">Query Log</text>
    <text x="16" y="52" class="screen-sub">In-RAM Only • App Attribution</text>

    <!-- Query Item 1 (Blocked) -->
    <g transform="translate(12, 68)">
      <rect width="186" height="54" rx="8" fill="#170A0F" stroke="#3D1620" />
      <circle cx="20" cy="22" r="10" fill="#2E0E16" />
      <text x="20" y="26" text-anchor="middle" fill="#FF5271" font-size="10" font-weight="700">C</text>
      <text x="36" y="19" class="item-title">Chrome</text>
      <text x="36" y="32" class="item-desc">googleads.g.doubleclick.net</text>
      <rect x="132" y="11" width="46" height="15" rx="3" fill="#3D0F19" />
      <text x="155" y="22" text-anchor="middle" fill="#FF5271" class="badge-txt">BLOCKED</text>
      <text x="36" y="45" fill="#7A686B" font-size="9">× 12 queries • 14:02:18</text>
    </g>

    <!-- Query Item 2 (Allowed) -->
    <g transform="translate(12, 130)">
      <rect width="186" height="54" rx="8" fill="#0A1612" stroke="#16382B" />
      <circle cx="20" cy="22" r="10" fill="#0F2D21" />
      <text x="20" y="26" text-anchor="middle" fill="#10D890" font-size="10" font-weight="700">S</text>
      <text x="36" y="19" class="item-title">Spotify</text>
      <text x="36" y="32" class="item-desc">spclient.wg.spotify.com</text>
      <rect x="132" y="11" width="46" height="15" rx="3" fill="#0E3324" />
      <text x="155" y="22" text-anchor="middle" fill="#10D890" class="badge-txt">ALLOWED</text>
      <text x="36" y="45" fill="#7A686B" font-size="9">× 4 queries • 14:02:11</text>
    </g>

    <!-- Query Item 3 (Blocked) -->
    <g transform="translate(12, 192)">
      <rect width="186" height="54" rx="8" fill="#170A0F" stroke="#3D1620" />
      <circle cx="20" cy="22" r="10" fill="#2E0E16" />
      <text x="20" y="26" text-anchor="middle" fill="#FF5271" font-size="10" font-weight="700">T</text>
      <text x="36" y="19" class="item-title">TikTok</text>
      <text x="36" y="32" class="item-desc">mon.byteoversea.com</text>
      <rect x="132" y="11" width="46" height="15" rx="3" fill="#3D0F19" />
      <text x="155" y="22" text-anchor="middle" fill="#FF5271" class="badge-txt">BLOCKED</text>
      <text x="36" y="45" fill="#7A686B" font-size="9">× 8 queries • 14:01:55</text>
    </g>

    <!-- Drilldown Rule Helper Callout -->
    <rect x="12" y="254" width="186" height="58" rx="8" fill="#1A1116" stroke="#4D1F2D"/>
    <text x="22" y="272" fill="#F3D9DC" font-size="10" font-weight="700">💡 Tap Any Query to Rule</text>
    <text x="22" y="288" fill="#C4B5B8" font-size="9.5">Set per-domain Allow or Block</text>
    <text x="22" y="300" fill="#A58E92" font-size="9">Capped at registrable domain via PSL</text>

    <text x="105" y="336" text-anchor="middle" fill="#FFA3B2" font-size="11" font-weight="600">Per-App Live Query Log</text>
  </g>

  <!-- ==================== SCREEN 3: LISTS ==================== -->
  <g transform="translate(520, 95)" filter="url(#phoneShadow)">
    <rect width="210" height="350" rx="16" fill="url(#phoneFrame)" stroke="#3D1D26" stroke-width="1.2" />
    <rect x="75" y="8" width="60" height="5" rx="2.5" fill="#2E161D" />

    <text x="16" y="38" class="screen-header">Blocklists</text>
    <text x="16" y="52" class="screen-sub">68,412 Rules Active</text>

    <!-- List item 1 -->
    <g transform="translate(12, 68)">
      <rect width="186" height="48" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">StevenBlack Unified</text>
      <text x="14" y="35" class="item-desc">54,120 hosts • Updated 2h ago</text>
      <circle cx="168" cy="24" r="5" fill="#00B074" />
    </g>

    <!-- List item 2 -->
    <g transform="translate(12, 124)">
      <rect width="186" height="48" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">OISD Basic</text>
      <text x="14" y="35" class="item-desc">14,292 hosts • Updated 2h ago</text>
      <circle cx="168" cy="24" r="5" fill="#00B074" />
    </g>

    <!-- Custom Rules Card -->
    <g transform="translate(12, 180)">
      <rect width="186" height="58" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">Custom User Rules</text>
      <text x="14" y="36" fill="#10D890" font-size="10">2 Allow Rules (Override)</text>
      <text x="14" y="50" fill="#FF5271" font-size="10">5 Block Rules</text>
    </g>

    <!-- Update Button -->
    <g transform="translate(12, 248)">
      <rect width="186" height="38" rx="8" fill="#D11F40" />
      <text x="93" y="24" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700">🔄 Check &amp; Compile Now</text>
    </g>

    <text x="105" y="336" text-anchor="middle" fill="#FFA3B2" font-size="11" font-weight="600">On-Device Compilation</text>
  </g>

  <!-- ==================== SCREEN 4: SETTINGS / DOH ==================== -->
  <g transform="translate(760, 95)" filter="url(#phoneShadow)">
    <rect width="210" height="350" rx="16" fill="url(#phoneFrame)" stroke="#3D1D26" stroke-width="1.2" />
    <rect x="75" y="8" width="60" height="5" rx="2.5" fill="#2E161D" />

    <text x="16" y="38" class="screen-header">DNS Resolvers</text>
    <text x="16" y="52" class="screen-sub">Pinned RFC 8484 DoH</text>

    <!-- Quad9 -->
    <g transform="translate(12, 68)">
      <rect width="186" height="42" rx="8" fill="#1C0E14" stroke="#D11F40" stroke-width="1.2" />
      <text x="14" y="20" class="item-title">Quad9 (Default)</text>
      <text x="14" y="33" fill="#D694A0" font-size="9.5">dns.quad9.net • 9.9.9.9</text>
      <circle cx="168" cy="21" r="5" fill="#D11F40" />
    </g>

    <!-- Cloudflare -->
    <g transform="translate(12, 118)">
      <rect width="186" height="42" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">Cloudflare</text>
      <text x="14" y="33" class="item-desc">cloudflare-dns.com • 1.1.1.1</text>
    </g>

    <!-- Mullvad -->
    <g transform="translate(12, 168)">
      <rect width="186" height="42" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">Mullvad Base</text>
      <text x="14" y="33" class="item-desc">base.dns.mullvad.net</text>
    </g>

    <!-- AdGuard -->
    <g transform="translate(12, 218)">
      <rect width="186" height="42" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">AdGuard DNS</text>
      <text x="14" y="33" class="item-desc">dns.adguard-dns.com</text>
    </g>

    <!-- Custom Upstream -->
    <g transform="translate(12, 268)">
      <rect width="186" height="42" rx="8" fill="#120A0E" stroke="#2B141C" />
      <text x="14" y="20" class="item-title">Custom Upstream URL</text>
      <text x="14" y="33" class="item-desc">+ Validated live test query</text>
    </g>

    <text x="105" y="336" text-anchor="middle" fill="#FFA3B2" font-size="11" font-weight="600">Zero-Leak DoH Resolvers</text>
  </g>
</svg>
